name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      # Thỉnh thoảng API của GitHub chưa kịp thấy artifact vừa upload nên deploy-pages báo
      # "No artifacts named github-pages were found" (lỗi tạm thời, run 45526973859). Thử lại một lần sau 30 giây.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Chờ trước khi thử deploy lại
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
