# SEO hằng tuần: Gemini viết thêm lời chúc mẫu và thiết kế một theme thiệp mới cho các dịp sắp tới, build trang, chạy test rồi mở PR để chủ site duyệt.
# Cần: secret GEMINI_API_KEY (miễn phí tại aistudio.google.com/apikey); Settings › Actions › General › bật
# "Allow GitHub Actions to create and approve pull requests". Không bắt buộc: secret GOATCOUNTER_TOKEN (số liệu trong PR),
# biến GEMINI_MODEL (đổi model). Chạy tay: tab Actions › Weekly SEO › Run workflow.
name: Weekly SEO
on:
  schedule:
    - cron: '0 1 * * 1' # 8:00 sáng thứ Hai giờ Việt Nam
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: weekly-seo
  cancel-in-progress: false
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Gemini viết lời chúc và thiết kế theme mới
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: node tools/marketing/weekly-seo.mjs --pr-body "$RUNNER_TEMP/pr-body.md"
      - name: Build trang dịp
        run: npm run build:pages -- --html
      - name: Test
        run: npm test
      - name: Mở PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # index.html đổi mỗi tuần (danh sách dịp sắp đến) nên không đủ để mở PR; nó đi kèm khi có lời chúc/theme mới.
          if git diff --quiet -- js/data/messages-auto.js js/data/themes-auto.js css/themes.css; then
            echo "Không có lời chúc hay theme mới — không mở PR."
            exit 0
          fi
          # Chỉ cho phép thay đổi lời chúc, theme tự sinh, trang dịp và trang chủ được build lại từ đó.
          bad=$(git diff --name-only | grep -v -E '^(js/data/messages-auto\.js|js/data/themes-auto\.js|css/themes\.css|index\.html|o/[^/]+/index\.html)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::File ngoài phạm vi bị thay đổi: $bad"
            exit 1
          fi
          day=$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d)
          branch="seo/$day-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add js/data/messages-auto.js js/data/themes-auto.js css/themes.css index.html o
          git commit -m "SEO: thêm lời chúc mẫu và theme tự sinh ($day)"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "SEO tuần $(TZ=Asia/Ho_Chi_Minh date +%d/%m): thêm lời chúc mẫu và theme" \
            --body-file "$RUNNER_TEMP/pr-body.md"
