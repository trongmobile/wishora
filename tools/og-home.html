<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Dancing+Script:wght@700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:"Be Vietnam Pro",sans-serif;color:#2b1d33;
 background:radial-gradient(900px 500px at 0% 0%,#ffe3ea 0%,transparent 60%),radial-gradient(700px 500px at 100% 100%,#e9ddff 0%,transparent 60%),#fff8f3;position:relative}
.left{position:absolute;left:80px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.brand{display:flex;align-items:center;gap:22px}
.brand svg{width:96px;height:96px;filter:drop-shadow(0 12px 22px rgba(214,47,92,.35))}
.brand b{font-size:84px;font-weight:800;letter-spacing:-2px;background:linear-gradient(135deg,#d62f5c,#8b2fc9);-webkit-background-clip:text;color:transparent}
h1{font-size:44px;line-height:1.15;font-weight:800;letter-spacing:-1px}
p{font-size:27px;color:#6b5d75;font-style:italic}
.card{position:absolute;width:210px;height:270px;border-radius:26px;border:5px solid #fff;box-shadow:0 26px 50px rgba(43,29,51,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:14px}
.card i{font-style:normal;font-size:76px;line-height:1}
.card span{font-family:"Playfair Display",serif;font-weight:700;font-size:25px;line-height:1.2}
.c1{left:700px;top:50px;transform:rotate(-7deg);background:radial-gradient(120% 80% at 50% 0,#d4202f,#6e0a16);color:#f5c542}
.c2{left:940px;top:30px;transform:rotate(6deg);background:linear-gradient(160deg,#fff7fa,#ffc0d5);color:#a3154f}
.c3{left:730px;top:300px;transform:rotate(4deg);background:radial-gradient(120% 80% at 50% 0,#167a4d,#082b1b);color:#fff3d6}
.c4{left:970px;top:290px;transform:rotate(-5deg);background:linear-gradient(160deg,#ffe066,#ff9ccb);color:#c2185b;z-index:2}
</style></head><body>
<div class="left">
 <div class="brand"><svg viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b8f"/><stop offset=".55" stop-color="#d62f5c"/><stop offset="1" stop-color="#8b2fc9"/></linearGradient></defs><rect width="32" height="32" rx="10" fill="url(#g)"/><path d="M7 12.5l4.4 11 4.6-9.2 4.6 9.2 4.4-11" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 4.6c.5 2 1.1 2.6 3 3.1-1.9.5-2.5 1.1-3 3.1-.5-2-1.1-2.6-3-3.1 1.9-.5 2.5-1.1 3-3.1z" fill="#ffd166"/></svg><b>Wishora</b></div>
 <h1>A greeting for every special moment</h1>
 <p>Gửi lời thương, trao niềm vui.</p>
</div>
<div class="card c1"><img src="../assets/illustrations/li-xi-vn.svg" width="170" height="152" style="margin-top:-6px"><span>Chúc Mừng Năm Mới</span></div>
<div class="card c2"><i>🌷</i><span>Chúc Mừng 20/10</span></div>
<div class="card c3"><i>🎄</i><span>Merry Christmas</span></div>
<div class="card c4"><i>🎂</i><span>Happy Birthday</span></div>
</body></html>
